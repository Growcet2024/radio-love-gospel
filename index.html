<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ================================================================
     RÁDIO LOVE GOSPEL — VERSÃO 11

     Este arquivo tem 5 partes, nesta ordem:

       1) CONFIGURAÇÕES   -> URL do streaming, ícone, vídeo e capa do vídeo
                             (É AQUI QUE VOCÊ COLA E TROCA)
       2) STYLE           -> cores e visual
       3) HTML            -> o que aparece na tela
       4) SCRIPT          -> o funcionamento

     ================================================================ -->

<!-- ################################################################
     2) STYLE
     ################################################################ -->
<style>

  /* ==============================================================
     CORES DO APP (todas juntas aqui)
     Para trocar uma cor, mude só o código aqui. O app inteiro
     (inclusive a amostra do vídeo) usa estes valores.
     ============================================================== */
  :root {
    /* Azuis do fundo (do topo, mais claro, até a base, mais escuro) */
    --azul-topo: #3B63E0;          /* topo do fundo; mesmo azul do ícone */
    --azul-medio-1: #2347B8;       /* fundo, 25% da altura */
    --azul-medio-2: #12286F;       /* fundo, 60% da altura */
    --azul-fundo: #070D24;         /* base do fundo (mais escuro) */

    /* Azuis dos detalhes */
    --azul-escuro: #0F1E5A;        /* base da aba de compartilhar e sombra da capa */
    --azul-aba-topo: #1B3A9E;      /* topo da aba de compartilhar */
    --azul-botao: #2B4FBF;         /* botão "Enviar" */
    --azul-botao-press: #2547AB;   /* botão "Enviar" quando apertado */
    --azul-onda: #9DB8FF;          /* ponta clara das ondas animadas */

    /* Vermelhos */
    --vermelho: #E5322D;           /* botão play, anéis e detalhes */
    --vermelho-escuro: #B3201C;    /* sombra do botão play */

    /* Textos */
    --texto: #F2F5FF;              /* texto principal */
    --texto-suave: #C9D6FF;        /* slogan, status e frases menores */
    --branco: #FFFFFF;             /* branco puro (textos e botões) */
  }


  /* ==============================================================
     BASE DA PÁGINA
     ============================================================== */

  /* Zera margens e espaçamentos padrão do navegador */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    height: 100%;
  }

  /* Fundo azul em degradê (claro em cima, escuro embaixo) */
  body {
    font-family: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--texto);
    background: linear-gradient(
      180deg,
      var(--azul-topo) 0%,
      var(--azul-medio-1) 25%,
      var(--azul-medio-2) 60%,
      var(--azul-fundo) 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }

  /* Coluna central que reúne tudo (capa, nome, play, volume) */
  .player {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 28px;
  }


  /* ==============================================================
     CAPA (ÍCONE REDONDO) E ANÉIS VERMELHOS ANIMADOS
     ============================================================== */

  /* Caixa que guarda a capa e os anéis (tamanho do ícone na tela) */
  .capa-wrap {
    position: relative;
    width: 200px;
    height: 200px;
  }

  /* Anéis vermelhos que pulsam enquanto a rádio toca */
  .anel {
    position: absolute;
    /* top/right/bottom/left funcionam em celulares antigos (o "inset" não) */
    top: -14px;
    right: -14px;
    bottom: -14px;
    left: -14px;
    border-radius: 50%;
    border: 2px solid var(--vermelho);
    opacity: 0;
  }

  .tocando .anel {
    animation: pulso 2.4s ease-out infinite;
  }

  .tocando .anel.b {
    animation-delay: 1.2s;
  }

  @keyframes pulso {
    0%   { transform: scale(.92); opacity: .7; }
    100% { transform: scale(1.18); opacity: 0; }
  }

  /* A capa em si (círculo com o ícone dentro) */
  .capa {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 25%, var(--azul-topo), var(--azul-escuro) 70%);
    box-shadow: 0 18px 50px rgba(59, 99, 224, .35), inset 0 0 0 2px rgba(255, 255, 255, .08);
  }

  .capa img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }


  /* ==============================================================
     NOME, SLOGAN E STATUS
     ============================================================== */

  /* Nome da rádio */
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .2px;
  }

  /* Slogan abaixo do nome */
  .slogan {
    margin-top: 6px;
    font-size: 16px;
    color: var(--texto-suave);
  }

  /* Linha de status (Toque para ouvir / No ar ...) */
  .status {
    margin-top: 14px;
    font-size: 14px;
    color: var(--texto-suave);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 20px;
  }

  /* Pontinho ao lado do status (fica vermelho quando está ao vivo) */
  .ponto {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--texto-suave);
  }

  .tocando .ponto {
    background: var(--vermelho);
    box-shadow: 0 0 10px var(--vermelho);
  }

  /* Plaquinha "NO AR": quadradinho vermelho com texto branco,
     como nas emissoras. Aparece só quando a rádio está tocando.
     (O texto vem do Script, em MSG_NO_AR, e é mostrado em maiúsculas aqui.) */
  .status.no-ar .ponto {
    display: none;
  }

  .status.no-ar #statusTexto {
    background: var(--vermelho);
    color: var(--branco);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
    box-shadow: 0 0 14px rgba(229, 50, 45, .55);
  }


  /* ==============================================================
     ONDAS ANIMADAS
     ============================================================== */

  .ondas {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 44px;
  }

  .ondas span {
    width: 5px;
    height: 8px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--vermelho), var(--azul-onda));
    transition: height .3s;
  }

  /* As ondas só se mexem quando está tocando */
  .tocando .ondas span {
    animation: onda 1s ease-in-out infinite;
  }

  .ondas span:nth-child(2n) { animation-delay: .15s; }
  .ondas span:nth-child(3n) { animation-delay: .30s; }
  .ondas span:nth-child(5n) { animation-delay: .45s; }

  @keyframes onda {
    0%, 100% { height: 8px; }
    50%      { height: 40px; }
  }


  /* ==============================================================
     BOTÃO PLAY / PAUSE
     ============================================================== */

  .play {
    width: 88px;
    height: 88px;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--vermelho), var(--vermelho-escuro));
    box-shadow: 0 12px 30px rgba(229, 50, 45, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }

  /* Efeito ao apertar */
  .play:active {
    transform: scale(.94);
    box-shadow: 0 6px 16px rgba(229, 50, 45, .4);
  }

  .play:focus-visible,
  .mudo:focus-visible {
    outline: 3px solid var(--branco);
    outline-offset: 4px;
  }

  .play svg {
    width: 38px;
    height: 38px;
    fill: var(--branco);
  }

  /* Mostra o ícone de play parado e o de pause tocando */
  .play .i-pause { display: none; }
  .tocando .play .i-play { display: none; }
  .tocando .play .i-pause { display: block; }

  .carregando .play {
    opacity: .7;
  }


  /* ==============================================================
     CONTROLE DE VOLUME
     ============================================================== */

  /* Caixa arredondada que guarda o mudo e a barra */
  .volume {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .08);
  }

  /* Botão do alto-falante (mudo) */
  .mudo {
    background: none;
    border: 0;
    cursor: pointer;
    display: flex;
    padding: 2px;
  }

  .mudo svg {
    width: 24px;
    height: 24px;
    fill: var(--texto);
  }

  .mudo .i-off { display: none; }
  .silenciado .mudo .i-on { display: none; }
  .silenciado .mudo .i-off { display: block; }

  /* Barra deslizante do volume */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 6px;
    border-radius: 3px;
    outline: none;
    background: linear-gradient(90deg, var(--vermelho) var(--v, 80%), rgba(255, 255, 255, .18) var(--v, 80%));
  }

  /* Bolinha da barra (Chrome / Android) */
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--branco);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
  }

  /* Bolinha da barra (Firefox) */
  input[type=range]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 50%;
    background: var(--branco);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
  }


  /* ==============================================================
     COMPARTILHAR: SÍMBOLO, ABA E BOTÃO "ENVIAR"
     ============================================================== */

  /* Símbolo discreto no canto superior direito */
  .abrir-share {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, .14);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: .8;
  }

  .abrir-share svg {
    width: 20px;
    height: 20px;
    fill: var(--branco);
  }

  .abrir-share:focus-visible,
  .btn-share:focus-visible {
    outline: 3px solid var(--branco);
    outline-offset: 3px;
  }

  /* Fundo escurecido atrás da aba (tocar nele fecha a aba) */
  .fundo-share {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: rgba(3, 8, 30, .55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }

  .share-aberto .fundo-share {
    opacity: 1;
    pointer-events: auto;
  }

  /* A aba que sobe de baixo para cima */
  .aba {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0 auto;
    max-width: 420px;
    padding: 4px 16px max(28px, env(safe-area-inset-bottom));
    max-height: 94vh;
    overflow-y: auto;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(180deg, var(--azul-aba-topo), var(--azul-escuro));
    box-shadow: 0 -12px 40px rgba(0, 0, 0, .4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
    transform: translateY(105%);
    visibility: hidden;
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s .35s;
  }

  /* Aba aberta */
  .share-aberto .aba {
    transform: translateY(0);
    visibility: visible;
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility 0s;
  }

  /* Tracinho no topo da aba (dá para arrastar para baixo) */
  .alca-wrap {
    padding: 10px 48px;
    touch-action: none;
  }

  .alca {
    width: 44px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .35);
  }

  /* Frase de incentivo */
  .aba p {
    font-size: 17px;
    line-height: 1.4;
    width: 100%;
    padding: 0 4px;
  }

  /* Caixa da amostra do vídeo + botão (mesma largura para os dois) */
  .conteudo-share {
    width: min(calc(100% - 8px), 46vh);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Amostra do vídeo: um quadrado com o vídeo (vertical) inteiro no meio.
     As laterais usam o MESMO degradê azul do fundo do vídeo, então tudo
     parece uma peça só. */
  .video-share {
    position: relative;
    width: 100%;
    height: 0;
    padding-top: 100%;   /* altura = largura (quadrado), compatível com celulares antigos */
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
    background: linear-gradient(
      180deg,
      var(--azul-topo) 0%,
      var(--azul-medio-1) 25%,
      var(--azul-medio-2) 60%,
      var(--azul-fundo) 100%
    );
  }

  /* Primeiro quadro do vídeo, na altura completa do quadrado */
  .video-share img {
    position: absolute;
    top: 0;
    left: 50%;
    height: 100%;
    width: auto;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    display: block;
  }

  /* Botãozinho de play no canto, para mostrar que é um vídeo */
  .video-share .play-mini {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    border: 1px solid rgba(255, 255, 255, .35);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .video-share .play-mini svg {
    width: 18px;
    height: 18px;
    fill: var(--branco);
    margin-left: 2px;
  }

  /* Botão "Enviar" */
  .btn-share {
    width: 100%;
    height: 40px;
    border: 0;
    border-radius: 8px;
    background: var(--azul-botao);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
    color: var(--branco);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-share:active {
    transform: scale(.97);
    background: var(--azul-botao-press);
  }

  /* Botão "Enviar" enquanto baixa o vídeo */
  .btn-share:disabled {
    opacity: .6;
  }

  /* Aviso pequeno embaixo do botão (erros) */
  .aviso-share {
    font-size: 13px;
    color: var(--texto-suave);
    min-height: 16px;
  }


  /* ==============================================================
     ACESSIBILIDADE: sem animações para quem pede menos movimento
     ============================================================== */
  @media (prefers-reduced-motion: reduce) {
    .tocando .anel,
    .tocando .ondas span {
      animation: none;
    }

    .aba,
    .fundo-share {
      transition: none;
    }
  }

</style>
</head>

<body>

<!-- ============ PLAYER (tela principal) ============ -->
<main class="player" id="player">

  <!-- Capa: ícone redondo com anéis animados -->
  <div class="capa-wrap">
    <div class="anel"></div>
    <div class="anel b"></div>
    <div class="capa" id="capa">
      <!-- A imagem do ícone é colocada pelo SCRIPT (ícone padrão ou o seu base64) -->
      <img id="iconeImg" alt="Rádio Love Gospel">

  </div>

  <!-- Nome e slogan (para trocar os textos, edite aqui) -->
  <div>

    <!-- Status: o texto muda sozinho (Toque para ouvir / No ar ...) -->

  <!-- Ondas animadas -->

  <button class="play" id="botaoPlay" aria-label="Tocar ou pausar">

      <svg class="i-off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a6.9 6.9 0 0 1-.6 2.8l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.9l2 2 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>

<!-- ============ COMPARTILHAR ============ -->

<!-- Símbolo discreto no canto superior direito -->
<button class="abrir-share" id="abrirShare" aria-label="Compartilhar">
  <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
</button>

<!-- Fundo escurecido (tocar nele fecha a aba) -->

<!-- Aba que sobe de baixo para cima -->

  <!-- Tracinho para arrastar -->
  <div class="alca-wrap" id="alca"><div class="alca"></div></div>

  <!-- Frase de incentivo (para trocar o texto, edite aqui) -->

    <div class="video-share">

        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

<!-- ################################################################
     4) SCRIPT (funcionamento)
     Normalmente você não precisa mexer aqui.
     Os textos de status estão no item 2 logo abaixo, se quiser trocar.
     ################################################################ -->
<script>

  // ==============================================================
  // 1) ELEMENTOS DA TELA
  // (ligações entre o código e o que aparece na tela)
  // ==============================================================
  var player = document.getElementById("player");
  var audio = document.getElementById("audio");
  var botaoPlay = document.getElementById("botaoPlay");
  var botaoMudo = document.getElementById("botaoMudo");
  var barra = document.getElementById("barraVolume");
  var volumeBox = document.getElementById("volume");
  var statusTexto = document.getElementById("statusTexto");
  var statusBox = document.getElementById("status");
  var capaImg = document.getElementById("iconeImg");

  var abrirShare = document.getElementById("abrirShare");
  var fundoShare = document.getElementById("fundoShare");
  var aba = document.getElementById("aba");
  var alca = document.getElementById("alca");
  var btnShare = document.getElementById("btnShare");
  var avisoShare = document.getElementById("avisoShare");


  // ==============================================================
  // 2) TEXTOS DE STATUS
  // Estas são as mensagens que aparecem embaixo do slogan.
  // Para trocar uma mensagem, mude só o texto entre as aspas.
  // ==============================================================
  var MSG_PARADO = "Toque para ouvir";                        // rádio parada
  var MSG_CONECTANDO = "Conectando...";                       // acabou de tocar no play
  var MSG_CARREGANDO = "Carregando...";                       // sinal oscilando
  var MSG_NO_AR = "No ar";                                    // tocando (aparece no quadradinho vermelho)
  var MSG_SEM_URL = "Adicione a URL do streaming no código";  // faltou colar a URL
  var MSG_ERRO = "Não foi possível conectar. Tente de novo."; // erro ao dar play
  var MSG_SEM_SINAL = "Sem conexão com a rádio";              // caiu a conexão

  // Mensagens da aba de compartilhar (aparecem embaixo do botão "Enviar")
  var MSG_SEM_VIDEO = "Adicione o link do vídeo no código";   // faltou colar o link
  var MSG_BAIXANDO = "Baixando o vídeo...";                   // baixando antes de enviar
  var MSG_ERRO_BAIXAR = "Não foi possível baixar o vídeo. Verifique a internet.";
  var MSG_TOQUE_DE_NOVO = "Vídeo pronto! Toque em Enviar de novo.";
  var MSG_ERRO_SHARE = "Não foi possível compartilhar.";
  var MSG_BAIXADO = "Seu aparelho não abre o compartilhar aqui. O vídeo foi baixado.";


  // ==============================================================
  // 3) LEITURA DAS CONFIGURAÇÕES (lá do topo do arquivo)
  // ==============================================================

  // Diz se um texto tem conteúdo (não está vazio)
  function temTexto(valor) {
    return typeof valor === "string" && valor.replace(/\s/g, "") !== "";
  }

  // URL do streaming (vazia se você ainda não colou)
  var URL_STREAM = temTexto(STREAM_URL) ? STREAM_URL.trim() : "";

  // Base64 do ícone (vazio = usa o padrão)
  var ICONE_OFICIAL = temTexto(ICONE_BASE64) ? ICONE_BASE64.trim() : "";

  // Base64 da capa do vídeo (vazio = usa o primeiro quadro do vídeo)
  var CAPA_OFICIAL = temTexto(VIDEO_CAPA_BASE64) ? VIDEO_CAPA_BASE64.trim() : "";

  // Lê uma cor da lista de cores do STYLE (ex.: cor("--vermelho"))
  function cor(nome) {
    return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
  }

  // Transforma o base64 colado em um endereço de imagem
  // (aceita com ou sem o começo "data:image/...")
  function paraImagem(base64) {
    return base64.indexOf("data:") === 0 ? base64 : "data:image/png;base64," + base64;
  }


  // ==============================================================
  // 4) ÍCONE DA TELA INICIAL
  // Usa o ícone padrão (lá no final do arquivo). Se você colou o
  // base64 do ícone nas configurações, usa o seu no lugar.
  // ==============================================================
  var iconeSrc = "";

  function iniciarIcone() {
    // Ícone padrão (guardado no final do arquivo)
    var padrao = document.getElementById("iconePadrao").textContent.replace(/\s/g, "");
    iconeSrc = "data:image/png;base64," + padrao;
    capaImg.src = iconeSrc;

    // Se existe um ícone seu, tenta usar
    if (ICONE_OFICIAL) {
      var src = paraImagem(ICONE_OFICIAL);
      var teste = new Image();
      teste.onload = function () {
        iconeSrc = src;
        capaImg.src = src;
      };
      // Se a imagem não carregar, continua o ícone padrão
      teste.src = src;
    }
  }

  // Espera a página carregar por inteiro (o ícone padrão fica no final)
  document.addEventListener("DOMContentLoaded", iniciarIcone);


  // ==============================================================
  // 5) PLAYER (play, pause e status)
  // ==============================================================

  // Escreve uma mensagem no status
  // (destaque = true mostra no quadradinho vermelho "NO AR")
  function mostrar(texto, destaque) {
    statusTexto.textContent = texto;
    statusBox.classList.toggle("no-ar", destaque === true);
  }

  // Começa a tocar
  function tocar() {
    // Sem URL colada: avisa e para
    if (!URL_STREAM) {
      mostrar(MSG_SEM_URL);
      return;
    }

    // Liga a rádio na URL
    if (!audio.src || audio.src === window.location.href) {
      audio.src = URL_STREAM;
    }

    player.classList.add("carregando");
    mostrar(MSG_CONECTANDO);

    audio.play().catch(function () {
      player.classList.remove("carregando");
      mostrar(MSG_ERRO);
    });
  }

  // Para de tocar
  function pausar() {
    audio.pause();

    // Zera a fonte para não ficar baixando o streaming em segundo plano
    audio.removeAttribute("src");
    audio.load();

    player.classList.remove("tocando", "carregando");
    mostrar(MSG_PARADO);
  }

  // Botão play / pause
  botaoPlay.addEventListener("click", function () {
    var tocandoAgora = player.classList.contains("tocando") || player.classList.contains("carregando");
    if (tocandoAgora) {
      pausar();
    } else {
      tocar();
    }
  });

  // Quando o áudio realmente começa
  audio.addEventListener("playing", function () {
    player.classList.remove("carregando");
    player.classList.add("tocando");
    mostrar(MSG_NO_AR, true);
  });

  // Quando o sinal oscila
  audio.addEventListener("waiting", function () {
    mostrar(MSG_CARREGANDO);
  });

  // Quando dá erro de conexão
  audio.addEventListener("error", function () {
    // Ignora o "erro" que acontece ao zerar a fonte no pause
    if (!audio.getAttribute("src")) {
      return;
    }
    player.classList.remove("tocando", "carregando");
    mostrar(MSG_SEM_SINAL);
  });


  // ==============================================================
  // 6) VOLUME
  // ==============================================================

  // Aplica o volume da barra e mostra o ícone certo (som / mudo)
  function atualizarVolume() {
    var v = Number(barra.value);
    audio.volume = v / 100;
    barra.style.setProperty("--v", v + "%");
    volumeBox.classList.toggle("silenciado", audio.muted || v === 0);
  }

  // Ao mexer na barra
  barra.addEventListener("input", function () {
    if (audio.muted && Number(barra.value) > 0) {
      audio.muted = false;
    }
    atualizarVolume();
  });

  // Botão do alto-falante (liga / desliga o mudo)
  botaoMudo.addEventListener("click", function () {
    audio.muted = !audio.muted;
    atualizarVolume();
  });

  atualizarVolume();


  // ==============================================================
  // 7) VÍDEO PARA COMPARTILHAR
  // O app baixa o vídeo (do link das configurações) e abre o
  // compartilhar do celular com o arquivo. Precisa de internet.
  // ==============================================================
  var videoBlob = null;       // vídeo já baixado (guardado para não baixar de novo)
  var videoBaixando = null;   // download em andamento

  // Link do vídeo (lido na hora de usar)
  function urlVideo() {
    return temTexto(VIDEO_URL) ? VIDEO_URL.trim() : "";
  }

  // Capa da amostra: primeiro quadro do vídeo (guardado no final do arquivo)
  // ou a imagem que você colou nas configurações
  function iniciarCapa() {
    var capa = document.getElementById("capaVideo");
    var padrao = "data:image/jpeg;base64," + document.getElementById("capaPadrao").textContent.replace(/\s/g, "");
    capa.src = padrao;

    if (CAPA_OFICIAL) {
      var src = paraImagem(CAPA_OFICIAL);
      var teste = new Image();
      teste.onload = function () {
        capa.src = src;
      };
      // Se a imagem não carregar, continua a capa padrão
      teste.src = src;
    }
  }
  document.addEventListener("DOMContentLoaded", iniciarCapa);

  // Baixa o vídeo (uma vez só)
  function baixarVideo() {
    if (videoBlob) {
      return Promise.resolve(videoBlob);
    }
    if (videoBaixando) {
      return videoBaixando;
    }
    var url = urlVideo();
    if (!url) {
      return Promise.reject(new Error("sem-link"));
    }
    videoBaixando = fetch(url).then(function (resp) {
      if (!resp.ok) {
        throw new Error("erro-" + resp.status);
      }
      return resp.blob();
    }).then(function (b) {
      videoBlob = (b.type === "video/mp4") ? b : new Blob([b], { type: "video/mp4" });
      videoBaixando = null;
      return videoBlob;
    }).catch(function (e) {
      videoBaixando = null;
      throw e;
    });
    return videoBaixando;
  }

  // Começa a baixar em segundo plano quando a aba abre (assim já fica pronto)
  function iniciarVideo() {
    if (urlVideo() && !videoBlob && !videoBaixando) {
      baixarVideo().catch(function () {});
    }
  }


  // ==============================================================
  // 8) ABA DE COMPARTILHAR (abrir, fechar e arrastar)
  // ==============================================================

  function abrirAba() {
    iniciarVideo();
    avisoShare.textContent = "";
    document.body.classList.add("share-aberto");
    aba.setAttribute("aria-hidden", "false");
  }

  function fecharAba() {
    document.body.classList.remove("share-aberto");
    aba.setAttribute("aria-hidden", "true");
  }

  // Toque no símbolo abre; toque no fundo escuro fecha
  abrirShare.addEventListener("click", abrirAba);
  fundoShare.addEventListener("click", fecharAba);

  // Arrastar o tracinho para baixo fecha a aba
  var y0 = null;

  alca.addEventListener("touchstart", function (e) {
    y0 = e.touches[0].clientY;
    aba.style.transition = "none";
  });

  alca.addEventListener("touchmove", function (e) {
    if (y0 === null) {
      return;
    }
    var descida = Math.max(0, e.touches[0].clientY - y0);
    aba.style.transform = "translateY(" + descida + "px)";
  });

  alca.addEventListener("touchend", function (e) {
    if (y0 === null) {
      return;
    }
    var d = e.changedTouches[0].clientY - y0;
    y0 = null;
    aba.style.transition = "";
    aba.style.transform = "";
    if (d > 80) {
      fecharAba();
    }
  });


  // ==============================================================
  // 9) BOTÃO "ENVIAR"
  // Abre o compartilhar do celular com o vídeo.
  // Se o aparelho não permitir, baixa o vídeo.
  // ==============================================================

  // Baixa o arquivo para o aparelho (plano B)
  function salvarArquivo(blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "radio-love-gospel.mp4";
    document.body.appendChild(a);
    a.click();
    a.remove();
    avisoShare.textContent = MSG_BAIXADO;
  }

  // Abre o compartilhar com o vídeo
  function compartilharVideo(blob) {
    var arquivo = null;
    try {
      arquivo = new File([blob], "radio-love-gospel.mp4", { type: "video/mp4" });
    } catch (e) {}

    var pode = arquivo && navigator.canShare && navigator.canShare({ files: [arquivo] });

    if (pode) {
      navigator.share({ files: [arquivo] }).then(fecharAba).catch(function (err) {
        // "AbortError" = a pessoa fechou o menu, não é erro
        if (!err || err.name === "AbortError") {
          return;
        }
        // O celular só deixa compartilhar logo depois do toque
        if (err.name === "NotAllowedError") {
          avisoShare.textContent = MSG_TOQUE_DE_NOVO;
        } else {
          avisoShare.textContent = MSG_ERRO_SHARE;
        }
      });
    } else {
      salvarArquivo(blob);
    }
  }

  btnShare.addEventListener("click", function () {
    // Sem link colado nas configurações
    if (!urlVideo()) {
      avisoShare.textContent = MSG_SEM_VIDEO;
      return;
    }

    // Vídeo já baixado: envia na hora
    if (videoBlob) {
      compartilharVideo(videoBlob);
      return;
    }

    // Ainda baixando: espera e depois envia
    avisoShare.textContent = MSG_BAIXANDO;
    btnShare.disabled = true;
    baixarVideo().then(function (b) {
      btnShare.disabled = false;
      avisoShare.textContent = "";
      compartilharVideo(b);
    }).catch(function () {
      btnShare.disabled = false;
      avisoShare.textContent = MSG_ERRO_BAIXAR;
    });
  });


  // ==============================================================
  // 10) CONTROLES NA TELA DE BLOQUEIO / NOTIFICAÇÃO
  // ==============================================================
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "No ar",
      artist: "Rádio Love Gospel"
    });
    navigator.mediaSession.setActionHandler("play", tocar);
    navigator.mediaSession.setActionHandler("pause", pausar);
  }

</script>
